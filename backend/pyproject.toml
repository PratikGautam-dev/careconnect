[project]
name = "careconnect-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.0",
    "pydantic-settings==2.15.0",  # core/config.py's centralized Settings object
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "redis==5.0.8",
    "PyJWT==2.9.0",  # RBAC staff/super-admin access tokens (auth/jwt_session.py, docs/rbac-redis-plan.md)
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.20",
    "psycopg2-binary==2.9.10",
    "boto3==1.43.65",  # patient document storage (core/storage.py) -- S3-compatible: works against real AWS S3 or Cloudflare R2 (cheaper egress) via a configurable endpoint URL
    "google-api-python-client==2.143.0",
    "google-auth==2.34.0",
    "Authlib==1.3.2",  # Section 15: Google OAuth sign-in for hospital onboarding/portal login (user_auth.py)
    "cryptography==50.0.0",  # core/crypto.py -- Fernet encryption-at-rest for Google Calendar OAuth tokens. Was already an installed transitive dep of Authlib; pinned directly now that it's imported by our own code.
    "itsdangerous==2.2.0",  # Starlette's SessionMiddleware (needed by Authlib's OAuth state/nonce handshake)
    "mercadopago==2.3.0",
    "pytz==2024.2",
    "alembic>=1.19.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
# Test-only: provisions an ephemeral Postgres container per test session
# (tests/conftest.py) so the suite runs against real Postgres, not SQLite.
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "pytest-httpx==0.30.0",
    "testcontainers[postgres]==4.15.0",
]
