[alembic]
# db/migrations/env.py sets sqlalchemy.url at runtime from
# db.connection.get_database_url() (same DATABASE_URL every repository
# already reads) -- nothing here needs a real connection string, dev/test/
# prod all resolve it the same way the app already does.
script_location = db/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
