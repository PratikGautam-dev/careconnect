name: CI
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # TODO: remove continue-on-error once the ~70 pre-existing lint errors are fixed
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck
